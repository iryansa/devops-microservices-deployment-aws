server {
    listen 80;
    server_name localhost;

    # Serve the React frontend for all standard routes
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Forward any /api/ requests to the Kubernetes backend service
    location /api/ {
        proxy_pass http://backend-svc.default.svc.cluster.local:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}